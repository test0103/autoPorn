[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoporn-ops"
version = "0.1.0"
description = "Local, extensible content-operations automation pipeline."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "openpyxl>=3.1",
  "pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
content-ops = "autoporn_ops.cli:main"

[tool.setuptools.packages.find]
include = ["autoporn_ops*"]
